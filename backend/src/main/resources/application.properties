spring.application.name=backend

# Puerto del backend (el frontend le pega a http://localhost:8080/api/...)
server.port=8080

# Conexión a PostgreSQL 17 local (base creada en la Parte 1).
# Usuario y contraseña se pueden cambiar con las variables de entorno DB_USER y DB_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/uruguay_mnatural
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate: crea y actualiza las tablas a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
