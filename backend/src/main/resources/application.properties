spring.application.name=backend

# Puerto del backend (el frontend le pega a http://localhost:8080/api/...)
server.port=8080

# Conexión a PostgreSQL 17 local (base creada en la Parte 1).
# Usuario y contraseña se pueden cambiar con las variables de entorno DB_USER y DB_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/uruguay_mnatural
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Servicio de pagos externo. "mercadopago" llama a la API de Mercado Pago con credenciales de
# prueba (su sandbox). "sandbox" llama al proveedor simulado incluido en este proyecto, que no
# necesita cuenta y también sirve para probar que el servicio falle o no responda.
payments.provider=${PAYMENTS_PROVIDER:mercadopago}

# Mercado Pago. El Access Token de PRUEBA no se sube a git: va en backend/secrets.properties
# (ver secrets.properties.example) o en la variable de entorno MP_ACCESS_TOKEN.
payments.mercadopago.url=https://api.mercadopago.com
payments.mercadopago.access-token=${MP_ACCESS_TOKEN:}
# Opcional: correo de un usuario de prueba de Mercado Pago para usar como pagador.
payments.mercadopago.test-payer-email=${MP_TEST_PAYER_EMAIL:}
# Lee backend/secrets.properties si existe (no está en git).
spring.config.import=optional:file:./secrets.properties

# Proveedor simulado (solo con payments.provider=sandbox).
payments.sandbox.url=http://localhost:8080/sandbox
# Espera máxima de la respuesta del servicio de pagos (RNF-11: 1 minuto).
payments.gateway.timeout-seconds=${PAYMENT_TIMEOUT_SECONDS:60}

# Inicio de sesión: clave con la que se firman los tokens (JWT) y cuántas horas duran.
# En un servidor real la clave se pasa por la variable de entorno JWT_SECRET.
security.jwt.secret=${JWT_SECRET:clave-de-desarrollo-de-uruguay-mnatural-cambiar-en-produccion}
security.jwt.expiration-hours=8

# Administrador inicial: se crea al arrancar si todavía no hay ninguno.
admin.email=${ADMIN_EMAIL:admin@uruguaymnatural.uy}
admin.password=${ADMIN_PASSWORD:admin1234}

# Dirección del frontend, para armar los enlaces que van en los correos.
frontend.url=http://localhost:5173
# Minutos que vale el enlace para cambiar la contraseña.
password-reset.minutes=30

# JPA / Hibernate: crea y actualiza las tablas a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Reservas: minutos que se retienen los lugares mientras el turista completa la reserva (RF-11),
# horas que queda pendiente si el pago falla (RF-23) y cada cuánto se revisan las vencidas (RNF-13).
booking.hold-minutes=10
booking.pending-hours=24
booking.expiration-check-ms=60000

# Servicio de clima externo (API pública Open-Meteo, gratis y sin clave). Si no responde en
# estos segundos, la actividad se muestra igual, sin el pronóstico (RNF-14).
weather.url=https://api.open-meteo.com
weather.timeout-seconds=5
